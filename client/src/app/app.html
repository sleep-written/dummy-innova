<mat-toolbar>
    <button mat-icon-button
    type="button"
    aria-label="Toggle menu"
    [attr.aria-expanded]="this.sidenavOpened()"
    (click)="this.sidenavOpened.set(!this.sidenavOpened())">
        <mat-icon>menu</mat-icon>
    </button>

    <a routerLink="/">DUMMY INNOVA</a>

    <div [style.flex]="1">
    </div>

    <app-session-chip>
    </app-session-chip>
</mat-toolbar>

<mat-sidenav-container
(backdropClick)="this.sidenavOpened.set(false)">
    <mat-sidenav
    autoFocus="dialog"
    [opened]="this.sidenavOpened()">
        <app-sidenav>
        </app-sidenav>
    </mat-sidenav>

    <mat-sidenav-content>
        <router-outlet>
        </router-outlet>
    </mat-sidenav-content>
</mat-sidenav-container>
